<ul class="resources" aria-label="Resources for {{ include.work.title | escape }}">{% if include.work.link %}<li><a href="{{ include.work.link | relative_url }}">{{ include.work.link_label | default: 'Read more' }}</a></li>{% endif %}{% for link in include.work.links %}<li><a href="{% assign start = link.url | slice: 0, 4 %}{% if start == 'http' %}{{ link.url | escape }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if link.note %} title="{{ link.note | escape }}"{% endif %}>{{ link.text | strip_html }}</a></li>{% endfor %}</ul>
